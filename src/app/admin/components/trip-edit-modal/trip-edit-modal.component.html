<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>✏️ {{ getTitle() }}</h2>
      <button class="btn-close" (click)="onClose()">✕</button>
    </div>

    <div class="modal-body">
      <!-- Transfer Type Edit -->
      <div *ngIf="entityType === 'transferType' && transferTypeForm">
        <div class="form-group">
          <label>Nombre *</label>
          <input
            type="text"
            [(ngModel)]="transferTypeForm.name"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Clave de Tipo *</label>
          <input
            type="text"
            [(ngModel)]="transferTypeForm.typeKey"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea
            [(ngModel)]="transferTypeForm.description"
            rows="4"
            class="form-control"
          ></textarea>
        </div>
        <div class="form-group">
          <label>Máximo de Pasajeros *</label>
          <input
            type="number"
            [(ngModel)]="transferTypeForm.maxPassengers"
            min="1"
            max="50"
            class="form-control"
          />
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input
              type="checkbox"
              [(ngModel)]="transferTypeForm.isRoundTripOption"
            />
            <span>Permitir Opción de Viaje Redondo</span>
          </label>
        </div>
      </div>

      <!-- Destination Edit -->
      <div *ngIf="entityType === 'destination' && destinationForm">
        <div class="form-group">
          <label>Nombre *</label>
          <input
            type="text"
            [(ngModel)]="destinationForm.name"
            (blur)="generateSlug()"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Slug *</label>
          <input
            type="text"
            [(ngModel)]="destinationForm.slug"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Duración *</label>
          <input
            type="text"
            [(ngModel)]="destinationForm.duration"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Distancia *</label>
          <input
            type="text"
            [(ngModel)]="destinationForm.distance"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea
            [(ngModel)]="destinationForm.description"
            rows="4"
            class="form-control"
          ></textarea>
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" [(ngModel)]="destinationForm.isRoundTrip" />
            <span>Destino de Viaje Redondo</span>
          </label>
        </div>
      </div>

      <!-- Pricing Tier Edit -->
      <div *ngIf="entityType === 'pricingTier' && pricingTierForm">
        <div class="form-group">
          <label>Tipo de Transfer *</label>
          <select
            [(ngModel)]="pricingTierForm.transferTypeId"
            class="form-control"
          >
            <option value="0" disabled>Seleccionar tipo de transfer</option>
            <option *ngFor="let type of transferTypes" [value]="type.id">
              {{ type.name }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Destino (opcional)</label>
          <select
            [(ngModel)]="pricingTierForm.destinationId"
            class="form-control"
          >
            <option [value]="null">Sin destino específico</option>
            <option *ngFor="let dest of destinations" [value]="dest.id">
              {{ dest.name }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Mínimo de Pasajeros *</label>
          <input
            type="number"
            [(ngModel)]="pricingTierForm.minPassengers"
            min="1"
            max="50"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Máximo de Pasajeros *</label>
          <input
            type="number"
            [(ngModel)]="pricingTierForm.maxPassengers"
            min="1"
            max="50"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Precio (EUR) *</label>
          <input
            type="number"
            [(ngModel)]="pricingTierForm.priceEur"
            min="0"
            step="0.01"
            class="form-control"
          />
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" [(ngModel)]="pricingTierForm.isSingleTrip" />
            <span>Solo Viaje de Ida</span>
          </label>
        </div>
      </div>

      <!-- Airport Edit -->
      <div *ngIf="entityType === 'airport' && airportForm">
        <div class="form-group">
          <label>Código de Aeropuerto *</label>
          <input
            type="text"
            [(ngModel)]="airportForm.code"
            class="form-control"
            maxlength="10"
          />
        </div>
        <div class="form-group">
          <label>Nombre del Aeropuerto *</label>
          <input
            type="text"
            [(ngModel)]="airportForm.name"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Ciudad *</label>
          <input
            type="text"
            [(ngModel)]="airportForm.city"
            class="form-control"
          />
        </div>
      </div>

      <!-- Pickup Type Edit -->
      <div *ngIf="entityType === 'pickupType' && pickupTypeForm">
        <div class="form-group">
          <label>Nombre *</label>
          <input
            type="text"
            [(ngModel)]="pickupTypeForm.name"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Clave de Tipo *</label>
          <input
            type="text"
            [(ngModel)]="pickupTypeForm.typeKey"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea
            [(ngModel)]="pickupTypeForm.description"
            rows="4"
            class="form-control"
          ></textarea>
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input
              type="checkbox"
              [(ngModel)]="pickupTypeForm.requiresAddress"
            />
            <span>Requiere Dirección</span>
          </label>
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input
              type="checkbox"
              [(ngModel)]="pickupTypeForm.requiresAirport"
            />
            <span>Requiere Aeropuerto</span>
          </label>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()">Cancelar</button>
      <button class="btn-save" (click)="onSubmit()">💾 Guardar Cambios</button>
    </div>
  </div>
</div>
