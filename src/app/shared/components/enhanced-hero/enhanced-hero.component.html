<section class="enhanced-hero-section" id="enhanced-hero">
  <!-- Particle Canvas Background -->
  <canvas id="particleCanvas" class="particle-canvas"></canvas>

  <!-- Video Background (Optional) -->
  <video
    #videoBackground
    class="video-background"
    autoplay
    muted
    loop
    playsinline
  >
    <source src="assets/videos/hero-bg.mp4" type="video/mp4" />
    <!-- Fallback if video not available -->
  </video>

  <!-- Gradient Overlay -->
  <div class="gradient-overlay"></div>

  <!-- Floating Elements -->
  <div class="floating-elements">
    <div class="floating-icon floating-icon-1">
      <fa-icon [icon]="faGlobe" size="2x"></fa-icon>
    </div>
    <div class="floating-icon floating-icon-2">
      <fa-icon [icon]="faRocket" size="3x"></fa-icon>
    </div>
    <div class="floating-icon floating-icon-3">
      <fa-icon [icon]="faCamera" size="2x"></fa-icon>
    </div>
    <div class="floating-icon floating-icon-4">
      <fa-icon [icon]="faRoute" size="2x"></fa-icon>
    </div>
    <div class="floating-icon floating-icon-5">
      <fa-icon [icon]="faPlane" size="3x"></fa-icon>
    </div>
  </div>

  <div class="container-fluid h-100">
    <div class="row h-100 align-items-center justify-content-center">
      <!-- Centered Main Content -->
      <div class="col-lg-8 col-xl-6 col-md-10 col-12">
        <div class="hero-content text-center">
          <!-- Hero Badge -->
          <div class="hero-badge mb-4">
            <span class="badge-premium">
              <fa-icon [icon]="faVanShuttle" class="me-2"></fa-icon>
              <span class="badge-text">Transfers Premium</span>
              <div class="badge-shine"></div>
            </span>
          </div>

          <!-- Dynamic Title -->
          <h1 class="hero-title mb-4">
            <span class="title-static">Explora Destinos Únicos</span>
          </h1>

          <!-- Enhanced Subtitle -->
          <p class="hero-subtitle mb-5">
            Conectamos destinos extraordinarios con nuestro servicio premium de
            transfers VIP. Vehículos de lujo, conductores certificados y
            experiencias que trascienden lo ordinario.
          </p>

          <!-- CTA Buttons -->
          <div class="hero-actions mb-5">
            <button
              class="btn btn-primary-gradient btn-lg me-3 mb-3"
              (click)="scrollToSection('van-transfers')"
            >
              <fa-icon [icon]="faVanShuttle" class="me-2"></fa-icon>
              Reservar Ahora
              <fa-icon [icon]="faArrowRight" class="ms-2"></fa-icon>
            </button>
          </div>

          <!-- Trust Indicators -->
          <div class="trust-indicators">
            <div class="row justify-content-center">
              <div class="col-auto">
                <div
                  class="trust-badges d-flex flex-wrap justify-content-center"
                >
                  <div class="trust-badge">
                    <fa-icon [icon]="faShieldAlt" class="trust-icon"></fa-icon>
                    <span>100% Seguro</span>
                  </div>
                  <div class="trust-badge">
                    <fa-icon [icon]="faCheck" class="trust-icon"></fa-icon>
                    <span>Certificado</span>
                  </div>
                  <div class="trust-badge">
                    <fa-icon [icon]="faInfinity" class="trust-icon"></fa-icon>
                    <span>Experiencias Únicas</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="scroll-indicator">
    <div class="scroll-mouse">
      <div class="scroll-wheel"></div>
    </div>
    <p class="scroll-text">Descubre más abajo</p>
    <fa-icon [icon]="faChevronDown" class="scroll-arrow"></fa-icon>
  </div>

  <!-- Decorative Elements -->
  <div class="decorative-elements">
    <div class="deco-circle deco-circle-1"></div>
    <div class="deco-circle deco-circle-2"></div>
    <div class="deco-circle deco-circle-3"></div>
  </div>
</section>
