<!-- Phone Input Picker Component -->
<div class="phone-input-picker">
  <!-- Label -->
  <label *ngIf="label" class="form-label">
    {{ label }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>

  <!-- Phone Input Container -->
  <div class="phone-input-container" [class.disabled]="disabled">
    <!-- Country Selector Button -->
    <div class="country-selector">
      <button
        type="button"
        class="country-button"
        [class]="'country-button-' + size"
        [disabled]="disabled"
        (mousedown)="onButtonClick($event)"
        (click)="$event.preventDefault(); $event.stopPropagation()"
      >
        <span class="country-flag">{{ selectedCountry.flag }}</span>
        <span class="country-code">{{ selectedCountry.dialCode }}</span>
        <fa-icon
          [icon]="faChevronDown"
          class="dropdown-icon"
          [class.rotated]="isDropdownOpen"
        ></fa-icon>
      </button>
    </div>

    <!-- Phone Number Input -->
    <div class="phone-number-container">
      <input
        type="tel"
        [class]="getFormControlClasses()"
        [placeholder]="placeholder"
        [disabled]="disabled"
        [value]="phoneNumber"
        (input)="onPhoneInput($event)"
        (blur)="onPhoneBlur()"
        (focus)="isTouched = true"
      />

      <!-- Validation Icons -->
      <div
        class="input-feedback"
        *ngIf="showValidation && isTouched && phoneNumber"
      >
        <fa-icon [icon]="faCheck" class="valid-icon" *ngIf="isValid"></fa-icon>
        <fa-icon
          [icon]="faPhone"
          class="invalid-icon"
          *ngIf="!isValid"
        ></fa-icon>
      </div>
    </div>
  </div>

  <!-- Error Message -->
  <div
    class="invalid-feedback d-block"
    *ngIf="!isValid && isTouched && phoneNumber && showValidation"
  >
    <small>
      {{
        errorMessage ||
          "Por favor, ingresa un número de teléfono válido (7-15 dígitos)"
      }}
    </small>
  </div>

  <!-- Help Text -->
  <div
    class="form-text"
    *ngIf="!errorMessage && !(!isValid && isTouched && phoneNumber)"
  >
    <small class="text-muted">
      Formato: {{ selectedCountry.dialCode }} 123 456 789
    </small>
  </div>
</div>

<!-- Country Picker Modal Overlay (Rendered at root level) -->
<div
  class="country-picker-overlay"
  *ngIf="isDropdownOpen"
  (mousedown)="onBackdropClick($event)"
>
  <div
    class="country-picker-modal"
    (mousedown)="$event.stopPropagation(); $event.preventDefault()"
  >
    <div class="modal-header">
      <h5 class="modal-title">
        <fa-icon [icon]="faGlobe" class="me-2"></fa-icon>
        Seleccionar País
      </h5>
      <button
        type="button"
        class="btn-close-modal"
        (mousedown)="onBackdropClick($event)"
      >
        ×
      </button>
    </div>

    <!-- Search Input -->
    <div class="modal-search">
      <input
        type="text"
        class="form-control"
        placeholder="Buscar país..."
        [value]="searchQuery"
        (input)="onCountrySearch($event)"
        (mousedown)="$event.stopPropagation()"
        autofocus
      />
    </div>

    <!-- Countries List -->
    <div class="modal-countries-list">
      <button
        type="button"
        class="country-item"
        *ngFor="let country of filteredCountries; trackBy: trackByCountryCode"
        (mousedown)="onCountrySelect($event, country)"
        [class.selected]="country.code === selectedCountry.code"
      >
        <span class="country-flag-large">{{ country.flag }}</span>
        <div class="country-info">
          <div class="country-name">{{ country.name }}</div>
          <div class="country-dial">{{ country.dialCode }}</div>
        </div>
        <fa-icon
          [icon]="faCheck"
          class="check-icon"
          *ngIf="country.code === selectedCountry.code"
        ></fa-icon>
      </button>

      <!-- No results message -->
      <div class="no-results" *ngIf="filteredCountries.length === 0">
        <fa-icon [icon]="faGlobe" size="2x" class="text-muted mb-2"></fa-icon>
        <p class="text-muted">No se encontraron países</p>
      </div>
    </div>
  </div>
</div>
