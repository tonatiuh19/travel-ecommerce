<div class="country-picker-wrapper" [class.disabled]="disabled">
  <!-- Label -->
  <label *ngIf="label" class="form-label">
    {{ label }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>

  <!-- Trigger Button -->
  <div
    class="country-picker-trigger"
    [class.is-invalid]="errorMessage && isTouched"
    [class.open]="isDropdownOpen"
    [class.has-value]="selectedCountry"
    (mousedown)="onButtonClick($event)"
    (click)="$event.preventDefault(); $event.stopPropagation()"
  >
    <div class="selected-country">
      <span class="country-flag" *ngIf="selectedCountry">{{
        selectedCountry.flag
      }}</span>
      <fa-icon
        *ngIf="!selectedCountry"
        [icon]="faGlobe"
        class="globe-icon"
      ></fa-icon>
      <span class="country-name" *ngIf="selectedCountry">{{
        selectedCountry.name
      }}</span>
      <span class="placeholder" *ngIf="!selectedCountry">{{
        placeholder
      }}</span>
    </div>
    <fa-icon
      [icon]="faChevronDown"
      class="dropdown-icon"
      [class.rotated]="isDropdownOpen"
    ></fa-icon>
  </div>

  <!-- Error Message -->
  <div class="invalid-feedback d-block" *ngIf="errorMessage && isTouched">
    {{ errorMessage }}
  </div>
</div>

<!-- Country Picker Modal Overlay (Rendered at root level) -->
<div
  class="country-modal-overlay"
  *ngIf="isDropdownOpen"
  (mousedown)="onBackdropClick($event)"
>
  <div
    class="country-modal"
    (mousedown)="$event.stopPropagation(); $event.preventDefault()"
  >
    <div class="modal-header">
      <h5 class="modal-title">
        <fa-icon [icon]="faGlobe" class="me-2"></fa-icon>
        Seleccionar País
      </h5>
      <button
        type="button"
        class="btn-close-modal"
        (mousedown)="onBackdropClick($event)"
      >
        ×
      </button>
    </div>

    <!-- Search Input -->
    <div class="modal-search">
      <fa-icon [icon]="faSearch" class="search-icon"></fa-icon>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="searchQuery"
        (input)="filterCountries()"
        placeholder="Buscar país..."
        (mousedown)="$event.stopPropagation()"
        autofocus
      />
    </div>

    <!-- Country List -->
    <div class="modal-countries-list">
      <button
        type="button"
        class="country-item"
        *ngFor="let country of filteredCountries"
        (mousedown)="onCountrySelect($event, country)"
        [class.selected]="selectedCountry?.code === country.code"
      >
        <span class="country-flag-large">{{ country.flag }}</span>
        <div class="country-info">
          <div class="country-name-text">{{ country.name }}</div>
          <div class="country-code-text">{{ country.code }}</div>
        </div>
        <fa-icon
          *ngIf="selectedCountry?.code === country.code"
          [icon]="faCheck"
          class="check-icon"
        ></fa-icon>
      </button>

      <!-- No results -->
      <div *ngIf="filteredCountries.length === 0" class="no-results">
        <fa-icon [icon]="faGlobe" size="2x" class="text-muted mb-2"></fa-icon>
        <p class="text-muted">No se encontraron países</p>
      </div>
    </div>
  </div>
</div>
